[package]
name = "snazzy-pro"
description = "Snazzy Pro for Windows and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "snazzy_pro_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snazzy-core = { path = "../../crates/snazzy-core" }
snazzy-agent = { path = "../../crates/snazzy-agent" }
snazzy-platform = { path = "../../crates/snazzy-platform" }
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"
tracing = "0.1"
