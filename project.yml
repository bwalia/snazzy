name: SnazzyPro
options:
  bundleIdPrefix: com.snazzy
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  SnazzyKit:
    path: Packages/SnazzyKit
targets:
  SnazzyPro:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SnazzyKit
        product: SnazzyCore
      - package: SnazzyKit
        product: Assistant
      - package: SnazzyKit
        product: CaptureEngine
      - package: SnazzyKit
        product: Slides
      - package: SnazzyKit
        product: Builder
      - package: SnazzyKit
        product: MCP
      - package: SnazzyKit
        product: Live
      - package: SnazzyKit
        product: Broadcast
      - package: SnazzyKit
        product: Remote
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Snazzy Pro
        CFBundleName: Snazzy Pro
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Snazzy Pro. All rights reserved."
        # HTTPS only (standard encryption): no export compliance documentation needed.
        ITSAppUsesNonExemptEncryption: false
        # Ollama / LM Studio on this Mac or another computer on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Snazzy Pro connects to AI models on other computers on your network (such as Ollama on a Mac Studio), and hosts live rooms that people on your Wi-Fi join from their browser.
        # .snazzy share files: open with Snazzy Pro (Finder, AirDrop, Mail).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.snazzy.pro.share
            UTTypeDescription: Snazzy Pro Share
            UTTypeConformsTo: [public.data, public.content]
            UTTypeIconFile: AppIcon
            UTTypeTagSpecification:
              public.filename-extension: [snazzy]
              public.mime-type: [application/x-snazzy-share]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Snazzy Pro Share
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.snazzy.pro.share]
        # Bonjour: the iPhone/iPad remote finds this Mac.
        NSBonjourServices: [_snazzyremote._tcp]
        NSCameraUsageDescription: Snazzy Pro records your camera (including an iPad or iPhone connected by USB) as an inset in your presentation videos.
        NSMicrophoneUsageDescription: Snazzy Pro records your microphone for presentation voice-over and on-device captions.
        NSSpeechRecognitionUsageDescription: Snazzy Pro creates captions from your recording using on-device speech recognition.
    entitlements:
      path: App/SnazzyPro.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Snazzy Pro's MCP server for AI agents (127.0.0.1 only, off by default).
        com.apple.security.network.server: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        # Remember repository folders the user picks (PR demos from local branches).
        com.apple.security.files.bookmarks.app-scope: true
        # Recordings and session logs save to ~/Movies/Snazzy Pro without save dialogs.
        com.apple.security.assets.movies.read-write: true
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snazzy.pro
        PRODUCT_NAME: SnazzyPro
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Snazzy Pro for iPhone and iPad: a remote for the Mac app. Same bundle ID
  # as the Mac app, so one App Store record covers both (Universal Purchase).
  SnazzyProiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iOS/Sources
      - path: iOS/Resources
    dependencies:
      - package: SnazzyKit
        product: Remote
      - package: SnazzyKit
        product: SnazzyCore
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Snazzy Pro
        CFBundleName: Snazzy Pro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Snazzy Pro scans the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: Snazzy Pro connects to Snazzy Pro on your Mac over Wi-Fi so you can control recording and slides.
        NSBonjourServices: [_snazzyremote._tcp]
        # Pairing links from the Camera app: snazzypro://pair?...
        CFBundleURLTypes:
          - CFBundleURLName: com.snazzy.pro.pair
            CFBundleURLSchemes: [snazzypro]
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snazzy.pro
        PRODUCT_NAME: SnazzyPro
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  SnazzyPro:
    build:
      targets:
        SnazzyPro: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SnazzyKit/SnazzyCoreTests
        - package: SnazzyKit/AssistantTests
  SnazzyProiOS:
    build:
      targets:
        SnazzyProiOS: all
    run:
      config: Debug
