# Snazzy Pro for Windows and Linux (desktop/): format, lint, test and build on
# both systems. Build prompt: docs/plans/PROMPT_WINDOWS_LINUX.md
name: Desktop

on:
  pull_request:
    paths: ["desktop/**", "docs/specs/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "docs/specs/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      # Only what the desktop app needs: other folders have file names Windows can't
      # check out (the proxy config uses "host:name.json"). Git for Windows rejects such
      # names even outside the sparse folders unless NTFS path protection is off; it's
      # safe here because those files are never written.
      - name: Allow the repo's file names on Windows
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.protectNTFS false
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            desktop
            docs/specs
            decks
          sparse-checkout-cone-mode: true
      - name: Linux system libraries (WebKitGTK, GTK, Secret Service)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-
      - name: UI
        working-directory: desktop/app
        run: |
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: App bundle
        working-directory: desktop/app
        run: npx tauri build --bundles ${{ runner.os == 'Windows' && 'msi' || 'deb' }}
      - uses: actions/upload-artifact@v4
        with:
          name: snazzy-pro-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # Every desktop change on main replaces the installers on the desktop-beta pre-release
  # under fixed names, which www.snazzy.pro/download.html links to (like mac-beta).
  publish:
    name: Publish beta
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: snazzy-pro-*
          path: dist
      - name: Upload to the desktop-beta release
        run: |
          set -euo pipefail
          one() { find "dist/$1" -name "*.$2" | head -n 1; }
          mkdir out
          cp "$(one snazzy-pro-Windows-X64 msi)" out/SnazzyPro-Windows-x64.msi
          cp "$(one snazzy-pro-Linux-X64 deb)" out/SnazzyPro-Linux-x64.deb
          cp "$(one snazzy-pro-Linux-ARM64 deb)" out/SnazzyPro-Linux-arm64.deb
          (cd out && sha256sum * > SHA256SUMS)
          notes="Snazzy Pro for Windows and Linux, free beta, built from ${GITHUB_SHA::7}. Windows 10 or 11 (x64; not code-signed yet). Ubuntu 24.04 or later, or another Debian-based distribution (x64 and ARM64). SHA-256 sums are in SHA256SUMS."
          gh release view desktop-beta >/dev/null 2>&1 || gh release create desktop-beta --prerelease \
            --target "$GITHUB_SHA" --title "Snazzy Pro for Windows and Linux (beta)" --notes "$notes"
          gh release upload desktop-beta out/* --clobber
          gh release edit desktop-beta --notes "$notes"
